<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - GAIL-orithm</title>
</head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #8a5f8a, #1a1a2e);
  color: #fff;
  line-height: 1.6;
}
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid #d8b8d8;
}

nav h2 {
  color: #e8d9e8;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

nav ul li a {
  text-decoration: none;
  color: #fff;
  font-weight: 500;
  transition: color 0.3s;
}

nav ul li a:hover {
  color: #e8d9e8;
}
.contact {
  padding: 60px 40px;
  text-align: center;
}

.contact h2 {
  color: #e6d6f7;
  margin-bottom: 20px;
}

form {
  max-width: 500px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, textarea {
  padding: 12px;
  border: none;
  border-radius: 5px;
  outline: none;
}

button.send {
  padding: 12px;
  border: none;
  border-radius: 5px;
  background: linear-gradient(90deg, #CDB9DD, #9580D4);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}
footer {
  text-align: center;
  padding: 20px;
  background: rgba(255, 255, 255, 0.05);
  border-top: 1px solid #d8b8d8;
  margin-top: 40px;
}

</style>
<body>
   <nav>
    <h2>GAIL-orithm</h2>
    <ul>

      <li><a href="C:\Users\Sophia\Desktop\Personal Website\AboutMe.html">About Me</a></li>
      <li><a href="C:\Users\Sophia\Desktop\Personal Website\Portfolio.html">Portfolio</a></li>
      <li><a href="C:\Users\Sophia\Desktop\Personal Website\Gallery.html">Gallery</a></li>
      <li><a href="C:\Users\Sophia\Desktop\Personal Website\Contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="contact">
    <h2>Get In Touch</h2>
    <p>Have an idea, project, or opportunity? Drop me a message below.</p>
    <form>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <input type="text" placeholder="Subject">
      <textarea rows="5" placeholder="Message"></textarea>
      <button class="send">Send Message</button>
    </form>
  </section>

  <footer>© 2026 Abbegail Peroy. All rights reserved.</footer>
</body>
</html>
